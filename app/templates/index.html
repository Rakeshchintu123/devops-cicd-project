<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps CI/CD Application</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">
        <h1>🚀 DevOps CI/CD Project</h1>

        <p class="subtitle">
            Flask Application Deployed using Jenkins, Docker and Kubernetes
        </p>

        <div class="cards">

            <div class="card">
                <h2>Jenkins</h2>
                <p>Automated CI/CD Pipeline</p>
            </div>

            <div class="card">
                <h2>Docker</h2>
                <p>Containerized Application</p>
            </div>

            <div class="card">
                <h2>Kubernetes</h2>
                <p>Container Orchestration</p>
            </div>

            <div class="card">
                <h2>Terraform</h2>
                <p>Infrastructure as Code</p>
            </div>

        </div>

        <div class="status">
            <h2>Application Status</h2>
            <p>✅ Application is Running Successfully</p>
        </div>

    </div>

</body>
</html>
